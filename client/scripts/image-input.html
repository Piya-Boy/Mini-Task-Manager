<script>
/** Attachment field of the task modal: existing Drive files plus local files waiting for upload. Images get previews, other files a type tile. */
const ImageInput = (() => {
  const zone = document.getElementById('drop-zone');
  const fileInput = document.getElementById('file-input');
  const grid = document.getElementById('image-grid');
  const errorList = document.getElementById('image-errors');
  const countEl = document.getElementById('attach-count');
  const { h, icon, formatSize, FILE_LIMITS } = Utils;
  const EXTENSIONS = { 'image/jpeg': 'jpg', 'image/png': 'png', 'image/webp': 'webp' };

  fileInput.setAttribute('accept', FILE_LIMITS.extensions.map((ext) => '.' + ext).join(','));

  let existing = [];
  let pending = [];
  let missing = new Set();
  let disabled = false;
  let pasteCounter = 0;

  function visible() {
    return existing.filter((e) => !e.removed);
  }

  function count() {
    return visible().length + pending.length;
  }

  function revokeAll() {
    pending.forEach((p) => { if (p.url) URL.revokeObjectURL(p.url); });
  }

  function reset(images) {
    revokeAll();
    existing = (images || []).map((image) => ({ image, removed: false }));
    pending = [];
    missing = new Set();
    setErrors([]);
    render();
  }

  function fileName(file) {
    if (file.name && file.name !== 'image.png') return file.name;
    pasteCounter += 1;
    return 'pasted-' + pasteCounter + '.' + (EXTENSIONS[file.type] || 'png');
  }

  function addFiles(fileList) {
    if (disabled) return;
    const errors = [];
    let total = count();
    Array.from(fileList || []).forEach((file) => {
      const name = fileName(file);
      if (FILE_LIMITS.extensions.indexOf(Utils.fileExtension(name)) === -1) {
        errors.push(name + ' — ไม่รองรับไฟล์ชนิดนี้');
      } else if (file.size > FILE_LIMITS.maxBytes) {
        errors.push(name + ' — ขนาด ' + formatSize(file.size) + ' เกิน 8 MB');
      } else if (total >= FILE_LIMITS.maxCount) {
        errors.push(name + ' — งานนี้มีไฟล์ครบ ' + FILE_LIMITS.maxCount + ' ไฟล์แล้ว');
      } else {
        total += 1;
        const isImage = Utils.isImageName(name);
        pending.push({ id: Utils.uuid(), file, name, isImage, url: isImage ? URL.createObjectURL(file) : null });
      }
    });
    setErrors(errors);
    render();
  }

  function setErrors(messages) {
    errorList.replaceChildren(...messages.map((m) => h('li', {}, m)));
    errorList.hidden = messages.length === 0;
  }

  function gallery() {
    return visible().filter((e) => Utils.isImageFile(e.image)).map((e) => ({ name: e.image.file_name, image: e.image }))
      .concat(pending.filter((p) => p.isImage).map((p) => ({ name: p.name, url: p.url })));
  }

  function fileBox(name, href) {
    const ext = Utils.fileExtension(name).toUpperCase();
    const content = [icon('fileLg'), h('span', { class: 'tile-ext' }, ext)];
    if (!href) return h('div', { class: 'tile-box tile-file', 'aria-hidden': 'true' }, content);
    return h('a', {
      class: 'tile-box tile-file is-link', href, target: '_blank', rel: 'noopener noreferrer',
      'aria-label': 'เปิด ' + name, title: 'เปิด ' + name,
    }, content);
  }

  function tile({ key, name, caption, isMissing, buildImage, onRemove, galleryIndex, fileHref, isFile }) {
    let box;
    if (isFile) {
      box = fileBox(name, fileHref);
    } else {
      box = h('button', {
        type: 'button',
        class: isMissing ? 'tile-box is-missing' : 'tile-box',
        'aria-label': 'ดู ' + name,
        disabled: isMissing || null,
        onClick: () => Lightbox.open(gallery(), galleryIndex),
      }, isMissing ? 'ไม่พบรูป' : icon('imageLg'));
      if (!isMissing) buildImage(box);
    }

    return h('li', { class: 'tile', dataset: { key } },
      box,
      h('button', {
        type: 'button', class: 'tile-remove', 'aria-label': 'นำ ' + name + ' ออก',
        disabled: disabled || null, onClick: onRemove,
      }, icon('close')),
      h('span', { class: 'tile-name', title: name }, name),
      h('span', { class: 'tile-caption' }, caption));
  }

  function render() {
    const total = count();
    countEl.textContent = total + ' / ' + FILE_LIMITS.maxCount;
    fileInput.disabled = disabled || total >= FILE_LIMITS.maxCount;

    const tiles = [];
    let galleryIndex = 0;
    visible().forEach((entry) => {
      const image = entry.image;
      if (!Utils.isImageFile(image)) {
        tiles.push(tile({
          key: image.image_id,
          name: image.file_name,
          caption: 'อัปโหลดแล้ว · ' + formatSize(image.size_bytes),
          isFile: true,
          fileHref: Utils.driveViewUrl(image),
          onRemove: () => {
            entry.removed = true;
            render();
          },
        }));
        return;
      }
      const isMissing = missing.has(image.image_id);
      tiles.push(tile({
        key: image.image_id,
        name: image.file_name,
        caption: isMissing ? 'ไม่พบใน Drive' : 'อัปโหลดแล้ว',
        isMissing,
        galleryIndex: galleryIndex++,
        buildImage: (box) => {
          const img = h('img', { alt: '' });
          img.addEventListener('load', () => box.replaceChildren(img), { once: true });
          ImageSource.load(img, image, 'thumb', (reason) => {
            if (reason === 'missing') {
              missing.add(image.image_id);
              render();
            }
          });
        },
        onRemove: () => {
          entry.removed = true;
          render();
        },
      }));
    });
    pending.forEach((item) => {
      tiles.push(tile({
        key: item.id,
        name: item.name,
        caption: 'ยังไม่อัปโหลด · ' + formatSize(item.file.size),
        isMissing: false,
        isFile: !item.isImage,
        galleryIndex: item.isImage ? galleryIndex++ : -1,
        buildImage: (box) => box.replaceChildren(h('img', { src: item.url, alt: '' })),
        onRemove: () => {
          if (item.url) URL.revokeObjectURL(item.url);
          pending = pending.filter((p) => p !== item);
          render();
        },
      }));
    });
    grid.replaceChildren(...tiles);
    grid.hidden = tiles.length === 0;
  }

  function setDisabled(value) {
    disabled = value;
    render();
  }

  function markUploaded(pendingId, image) {
    const item = pending.find((p) => p.id === pendingId);
    if (!item) return;
    if (item.url) URL.revokeObjectURL(item.url);
    pending = pending.filter((p) => p !== item);
    existing.push({ image, removed: false });
    render();
  }

  function commitRemovals() {
    existing = existing.filter((e) => !e.removed);
  }

  function isDraggingFiles(event) {
    return event.dataTransfer && Array.from(event.dataTransfer.types || []).indexOf('Files') !== -1;
  }

  zone.addEventListener('dragover', (event) => {
    if (!isDraggingFiles(event)) return;
    event.preventDefault();
    event.dataTransfer.dropEffect = disabled ? 'none' : 'copy';
    zone.classList.add('is-active');
  });
  zone.addEventListener('dragleave', (event) => {
    if (!zone.contains(event.relatedTarget)) zone.classList.remove('is-active');
  });
  zone.addEventListener('drop', (event) => {
    event.preventDefault();
    zone.classList.remove('is-active');
    addFiles(event.dataTransfer.files);
  });
  fileInput.addEventListener('change', () => {
    addFiles(fileInput.files);
    fileInput.value = '';
  });

  return {
    reset,
    addFiles,
    setErrors,
    setDisabled,
    markUploaded,
    commitRemovals,
    clear: () => reset([]),
    getPending: () => pending.slice(),
    getRemovedIds: () => existing.filter((e) => e.removed).map((e) => e.image.image_id),
    hasChanges: () => pending.length > 0 || existing.some((e) => e.removed),
  };
})();
</script>
