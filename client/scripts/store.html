<script>
const Store = (() => {
  const VIEW_KEY = 'mini-tasks.view';
  const state = {
    tasks: [],
    status: 'loading',
    error: '',
    view: Utils.storageGet(VIEW_KEY) === 'board' ? 'board' : 'list',
    query: '',
    boardColumn: 'todo',
  };
  const listeners = new Set();

  function emit() {
    listeners.forEach((fn) => fn(state));
  }

  function sortTasks(tasks) {
    return tasks.slice().sort((a, b) => a.position - b.position || a.created_at - b.created_at);
  }

  function upsertMany(tasks) {
    const byId = new Map(state.tasks.map((t) => [t.task_id, t]));
    tasks.forEach((t) => byId.set(t.task_id, t));
    state.tasks = sortTasks(Array.from(byId.values()));
  }

  return {
    get: () => state,
    subscribe(fn) {
      listeners.add(fn);
      return () => listeners.delete(fn);
    },
    setTasks(tasks) {
      state.tasks = sortTasks(tasks);
      state.status = 'ready';
      state.error = '';
      emit();
    },
    setLoadError(message) {
      state.status = 'error';
      state.error = message;
      emit();
    },
    setLoading() {
      state.status = 'loading';
      emit();
    },
    upsertTasks(tasks) {
      upsertMany(tasks);
      emit();
    },
    removeTask(taskId) {
      state.tasks = state.tasks.filter((t) => t.task_id !== taskId);
      emit();
    },
    findTask(taskId) {
      return state.tasks.find((t) => t.task_id === taskId) || null;
    },
    setView(view) {
      state.view = view;
      Utils.storageSet(VIEW_KEY, view);
      emit();
    },
    setQuery(query) {
      state.query = query;
      emit();
    },
    setBoardColumn(status) {
      state.boardColumn = status;
      emit();
    },
    filteredTasks() {
      const q = state.query.trim().toLocaleLowerCase();
      if (!q) return state.tasks;
      return state.tasks.filter((t) => {
        const linkText = Utils.linksOf(t).map((l) => l.url).join('\n');
        return (t.title + '\n' + t.description + '\n' + linkText).toLocaleLowerCase().includes(q);
      });
    },
  };
})();
</script>
