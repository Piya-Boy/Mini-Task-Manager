<dialog class="lightbox" id="lightbox" aria-label="ดูรูปภาพ">
  <div class="lightbox-inner">
    <div class="lightbox-bar">
      <span class="lightbox-name" id="lightbox-name"></span>
      <span class="lightbox-pos" id="lightbox-pos"></span>
      <button type="button" class="lightbox-btn" id="lightbox-close" aria-label="ปิดหน้าดูรูป">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="lightbox-stage">
      <button type="button" class="lightbox-btn" id="lightbox-prev" aria-label="รูปก่อนหน้า">
        <svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M10 3.5L5.5 8l4.5 4.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="lightbox-frame" id="lightbox-frame"></div>
      <button type="button" class="lightbox-btn" id="lightbox-next" aria-label="รูปถัดไป">
        <svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M6 3.5L10.5 8 6 12.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </div>
</dialog>
