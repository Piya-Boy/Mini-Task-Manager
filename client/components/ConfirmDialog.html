<dialog class="dialog dialog-sm" id="confirm-dialog" role="alertdialog" aria-labelledby="confirm-title" aria-describedby="confirm-message">
  <div class="confirm-body">
    <h2 id="confirm-title"></h2>
    <p id="confirm-message"></p>
    <div class="confirm-actions">
      <button type="button" class="btn btn-secondary" id="confirm-cancel">ยกเลิก</button>
      <button type="button" class="btn btn-danger" id="confirm-ok">ลบงาน</button>
    </div>
  </div>
</dialog>
